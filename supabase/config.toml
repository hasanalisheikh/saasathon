# Supabase local dev config — run `supabase start` to spin up a local instance
# Docs: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://monad-weld.vercel.app"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000", "https://monad-weld.vercel.app/**", "https://monad-weld.vercel.app/api/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8


[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your Monad account"
content_path = "/Users/hasansheikh/Documents/GitHub/saasathon/supabase/templates/confirmation.html"

