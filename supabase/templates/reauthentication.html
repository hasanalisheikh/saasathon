<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Monad verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#080c14;font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#080c14;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background-color:#f59e0b;width:8px;height:28px;border-radius:2px;"></td>
                  <td style="width:8px;"></td>
                  <td style="font-size:20px;font-weight:700;color:#f0f4ff;letter-spacing:-0.5px;">monad</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#0f1624;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:40px 36px;">

              <!-- Code icon -->
              <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td style="background-color:#1c1a0a;border:1px solid rgba(245,158,11,0.25);border-radius:10px;width:48px;height:48px;text-align:center;vertical-align:middle;">
                    <span style="font-size:22px;">🔐</span>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 8px;font-size:22px;font-weight:700;color:#f0f4ff;line-height:1.2;">Your verification code</p>
              <p style="margin:0 0 24px;font-size:14px;color:#8892a4;line-height:1.6;">
                Use the code below to verify your identity in Monad.
              </p>

              <!-- Code display -->
              <table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-bottom:28px;">
                <tr>
                  <td style="background-color:#161e2e;border:1px solid rgba(245,158,11,0.2);border-radius:8px;padding:20px;text-align:center;">
                    <span style="font-size:32px;font-weight:700;color:#f59e0b;letter-spacing:0.15em;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:28px 0;">
                <tr>
                  <td style="border-top:1px solid rgba(255,255,255,0.06);"></td>
                </tr>
              </table>

              <p style="margin:0;font-size:12px;color:#4a5568;line-height:1.6;">
                This code expires in 10 minutes. If you didn't request this, you can safely ignore this email.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:28px;">
              <p style="margin:0;font-size:12px;color:#4a5568;">
                Monad · AI-powered scope creep protection
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
