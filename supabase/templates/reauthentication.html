<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Monad verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="line-height:0;">
                    <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                      <circle cx="16" cy="16" r="4" fill="#171717" />
                      <line x1="16" y1="12" x2="16" y2="4" stroke="#171717" stroke-width="2" stroke-linecap="round" />
                      <line x1="20" y1="18.9" x2="27" y2="23" stroke="#171717" stroke-width="2" stroke-linecap="round" />
                      <line x1="12" y1="18.9" x2="5" y2="23" stroke="#171717" stroke-width="2" stroke-linecap="round" />
                    </svg>
                  </td>
                  <td style="width:10px;"></td>
                  <td style="font-size:20px;font-weight:700;color:#171717;letter-spacing:-0.5px;">monad</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:40px 36px;">

              <!-- Code icon -->
              <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td style="background-color:#f5f5f5;border:1px solid #e5e5e5;border-radius:10px;width:48px;height:48px;text-align:center;vertical-align:middle;">
                    <span style="font-size:22px;">🔐</span>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 8px;font-size:22px;font-weight:700;color:#171717;line-height:1.2;">Your verification code</p>
              <p style="margin:0 0 24px;font-size:14px;color:#737373;line-height:1.6;">
                Use the code below to verify your identity in Monad.
              </p>

              <!-- Code display -->
              <table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-bottom:28px;">
                <tr>
                  <td style="background-color:#f5f5f5;border:1px solid #e5e5e5;border-radius:8px;padding:20px;text-align:center;">
                    <span style="font-size:32px;font-weight:700;color:#171717;letter-spacing:0.15em;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:28px 0;">
                <tr>
                  <td style="border-top:1px solid #eeeeee;"></td>
                </tr>
              </table>

              <p style="margin:0;font-size:12px;color:#737373;line-height:1.6;">
                This code expires in 10 minutes. If you didn't request this, you can safely ignore this email.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:28px;">
              <p style="margin:0;font-size:12px;color:#737373;">
                Monad · AI-powered scope creep protection
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
